<div class="toolbar">

  <div class="container">
    <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
    <input type="text" #brand placeholder="Brand or model..."
      (input)="selectAutos(brand.value)">
  </div>

  <div class="control">
    <label for="sort">Sort by</label>
    <select #sort id="sort" (change)="onSortChange(sort.value)">
      <option value="">Default</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="power-desc">Most powerful</option>
    </select>
  </div>

  <div class="control">
    <label for="price">Max price: <b>{{ maxPrice }} K DNT</b></label>
    <input #price id="price" type="range" min="0" [max]="priceMax" step="10"
      [value]="maxPrice" (input)="onPriceChange(price.value)">
  </div>

  <button class="chip" [class.active]="onlyFavorites" (click)="toggleOnlyFavorites()">
    <fa-icon [icon]="faHeart"></fa-icon> Favorites only
  </button>
</div>

<div class="brands">
  @for (b of brands; track b) {
    <button class="brand-chip" [class.active]="selectedBrand === b" (click)="selectBrand(b)">{{ b }}</button>
  }
</div>

<p class="results-count">{{ selectedAutos.length }} car{{ selectedAutos.length === 1 ? '' : 's' }} found</p>

<div class="cars-container">
  @for (auto of visibleAutos; track auto.id) {
    <app-car-card
      [auto]="auto"
      [powerMax]="powerMax"
      [isFavorite]="favorites.includes(auto.id)"
      [isCompared]="compareIds.includes(auto.id)"
      (onSelect)="onSelectCar.emit($event)"
      (onToggleFavorite)="onToggleFavorite.emit($event)"
      (onToggleCompare)="onToggleCompare.emit($event)">
    </app-car-card>
  } @empty {
    <div class="empty">
      <p>No car matches your search 🚗</p>
      <button class="chip" (click)="resetFilters(); brand.value = ''; sort.value = ''">Reset filters</button>
    </div>
  }
</div>

@if (remaining > 0) {
  <div class="load-more">
    <button class="chip" (click)="loadMore()">Load more ({{ remaining }} left)</button>
  </div>
}
